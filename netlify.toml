[build]
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from   = "/api/feedback-admin/*"
  to     = "/.netlify/functions/feedback-admin/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  # Netlify serves an existing static file (this SPA catch-all's own /sw.js, /manifest.webmanifest,
  # /icons/*) before falling back to a redirect, so this rule never shadows them — no exception
  # needed here.

# Service worker must never be served from a stale CDN cache, or a deploy's new sw.js can't
# reach clients to invalidate old caches (see public/sw.js's CACHE_VERSION comment).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Security headers, all paths. Netlify merges overlapping [[headers]] blocks (additive, not
# override) — these apply ON TOP OF the /sw.js and /manifest.webmanifest blocks above, which keep
# their own Cache-Control/Content-Type untouched since neither key is set again here.
#
# CSP ships Report-Only for now (see docs/security-headers.md for the flip-to-enforcing rollout).
# Audit behind this policy (2026-10-14, npm run build + grep, see commit for full notes):
#   - index.html has exactly one inline <script> (sets window.__SUPABASE_URL__ / __SUPABASE_ANON__
#     / __ALLOWED_EMAIL_DOMAIN__ / __SOLVER_URL__ from %VITE_*% tokens). These tokens are NOT
#     resolved by `vite build` (dist/index.html still has the literal "%VITE_SUPABASE_URL%" etc.
#     text) — Netlify's own HTML snippet-injection substitutes them post-build, per deploy
#     context. That means this script's content (and therefore its sha256 hash) differs between
#     production and deploy-preview contexts and changes any time a chief rotates an env var —
#     a committed hash would go stale silently and start blocking the app under enforcing CSP.
#     Using 'unsafe-inline' for script-src here is the pragmatic call for a config-only inline
#     block; see docs/security-headers.md for the alternative (move these to vite.config.js
#     `define` constants, same pattern already used for __APP_VERSION__, which would let
#     script-src drop 'unsafe-inline' entirely).
#   - React sets ~46 inline `style={{...}}` props across the app (grid zoom, DAY_MARKERS colors,
#     drag-and-drop, etc.) — these mutate the DOM `style` attribute under the hood, same as
#     `style="..."` in markup, so style-src needs 'unsafe-inline' too (no hash/nonce path for
#     dynamic per-render inline styles).
#   - PDF export (jsPDF, src/ResidentScheduler.jsx pdfSave()), CSV/.ics export, and the raw-text
#     log-entry export all build `blob:` URLs via `new Blob()` + `URL.createObjectURL()` — hence
#     img-src/worker-src blob:. No `new Worker(...)` anywhere in src/ (grep confirmed), so
#     worker-src is just 'self' plus blob: for forward-compat with jsPDF/xlsx internals.
#   - Fonts (Barlow, Barlow Condensed, JetBrains Mono) are bundled by Vite into dist/assets/*.woff2
#     — no Google Fonts or other font CDN at runtime, so font-src needs nothing but 'self'.
#   - Cloud sync (hand-rolled sbFetch) and Auth (@supabase/supabase-js in src/supabaseClient.js)
#     both talk to `${VITE_SUPABASE_URL}/rest/v1` and `/auth/v1` on *.supabase.co; supabase-js
#     also carries a Realtime client capable of wss:// even though no `.channel()` call exists in
#     src/ today (grep confirmed) — connect-src allows both defensively.
#   - Optional CP-SAT solver (src/lib/solverClient.js, gated by VITE_SOLVER_URL/SOLVER_ENABLED)
#     posts to `${VITE_SOLVER_URL}/solve`. No solver hostname is committed anywhere in this repo
#     (it's Netlify-env-only) — connect-src allows *.fly.dev as the documented hosting platform;
#     narrow this to the exact solver hostname once pulled from the Netlify dashboard's env vars.
#   - Framing: the app is never embedded (user-confirmed 2026-10-14), so frame-ancestors 'none'
#     and X-Frame-Options DENY (enforced now — XFO has no report-only mode, and nothing frames the
#     app). pdfSave()'s iframe branch is dead in production as a result; harmless to keep.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.fly.dev; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
